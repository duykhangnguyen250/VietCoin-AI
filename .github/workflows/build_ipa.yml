name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: ./app_web_view
        run: |
          flutter pub get
          cd ios
          pod install

      - name: Build iOS no-codesign
        working-directory: ./app_web_view
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        working-directory: ./app_web_view
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app_web_view.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app_web_view_ipa
          path: app_web_view/app_web_view.ipa

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest iOS WebView Build
          body: |
            Bản build tự động mới nhất của app iOS WebView (.ipa).
            Bạn có thể tải về trực tiếp từ phần Assets bên dưới mà không cần đăng nhập GitHub.
          draft: false
          prerelease: false
          files: app_web_view/app_web_view.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


